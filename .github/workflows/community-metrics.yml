name: CWNU Community Metrics

on:
  schedule:
    # 11:00 China Standard Time (UTC+8).
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/community-metrics.yml
      - scripts/community_metrics.py
      - tests/test_community_metrics.py

concurrency:
  group: community-metrics-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Add the METRICS_TOKEN repository secret with read:org scope before running this workflow."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check generator
        run: python3 -m unittest discover -s tests -v

      - name: Generate community statistics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}
        run: python3 scripts/community_metrics.py

      - name: Commit community statistics
        run: |
          git add profile/community-activity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update community metrics'
          python3 scripts/community_metrics.py --update-reference "$(git rev-parse HEAD)"
          git add profile/README.md
          git commit -m 'chore: refresh community card reference'
          git push
