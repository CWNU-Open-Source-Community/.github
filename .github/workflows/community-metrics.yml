name: CWNU Community Metrics

on:
  schedule:
    # 11:00 China Standard Time (UTC+8).
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/community-metrics.yml

concurrency:
  group: community-metrics-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::Add the METRICS_TOKEN repository secret with read:org scope before running this workflow."
            exit 1
          fi

      - name: Generate community statistics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: CWNU-Open-Source-Community
          template: classic
          filename: profile/community-metrics.svg
          base: header, repositories, metadata
          config_timezone: Asia/Shanghai
          config_octicon: yes

          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage

          plugin_stargazers: yes
          plugin_stargazers_days: 30
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph

          plugin_followup: yes
          plugin_followup_sections: repositories

          plugins_errors_fatal: yes
          output_action: commit
          committer_token: ${{ github.token }}
          committer_branch: ${{ github.ref_name }}
          committer_message: "chore: update community metrics"
